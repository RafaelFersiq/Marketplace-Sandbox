# MCP Toolbox for Databases Configuration
# Marketplace Sandbox — Data Engineering Platform

sources:
  # Local PostgreSQL Database (Transactional & Airflow Metadata)
  postgres-marketplace:
    kind: postgres
    host: "127.0.0.1"
    port: 5432
    database: "marketplace"
    user: "postgres"
    password: "postgres"

tools:
  # Tool 1: List all public tables
  list-public-tables:
    kind: postgres-sql
    source: postgres-marketplace
    description: "Lists all public tables available in the PostgreSQL database"
    statement: |
      SELECT table_schema, table_name, table_type
      FROM information_schema.tables 
      WHERE table_schema NOT IN ('pg_catalog', 'information_schema')
      ORDER BY table_schema, table_name;

  # Tool 2: Inspect columns and data types for a table
  describe-table-columns:
    kind: postgres-sql
    source: postgres-marketplace
    description: "Lists column names, data types, and nullability for a specified table"
    statement: |
      SELECT column_name, data_type, is_nullable, column_default
      FROM information_schema.columns
      WHERE table_name = $1
      ORDER BY ordinal_position;
    parameters:
      - name: table_name
        type: string
        description: "The name of the table to describe"

  # Tool 3: Get row count for a table
  get-table-row-count:
    kind: postgres-sql
    source: postgres-marketplace
    description: "Returns total row count for a given table in public schema"
    statement: |
      SELECT COUNT(*) AS total_rows FROM orders;
